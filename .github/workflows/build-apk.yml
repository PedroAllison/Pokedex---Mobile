name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pokedex-camera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pokedex-camera-apk
          path: pokedex-camera.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Pokédex Câmera (APK mais recente)
          body: Baixe o arquivo **pokedex-camera.apk**, abra no Android e instale.
          files: pokedex-camera.apk
          make_latest: true
